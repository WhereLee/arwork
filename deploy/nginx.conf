server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket：前端连 /api/ws，这里转给后端的 /ws。
    # 必须显式带 upgrade 头，否则握手直接 400，而且报错很难看出原因。
    location /api/ws {
        proxy_pass http://api:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 后端每 25 秒发一次心跳，这里给足余量，别让 nginx 先掐断长连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端用相对路径 /api 访问后端，由这里转给 api 容器。
    # 这样只有 9400 一个端口对外，后端不暴露，也不需要 CORS。
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 分诊最长等 8 秒，留一点余量，别让 nginx 先断开
        proxy_read_timeout 20s;
    }

    # 前端是单页应用，刷新子路由要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 产物带 hash，可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
