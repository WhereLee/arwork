name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go 鍚庣
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 鐗堟湰浠?go.mod 璇伙紝閬垮厤鍜屾湰鍦板伐鍏烽摼瀵逛笉涓?
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 闈欐€佹鏌?
        run: go vet ./...

      # 鐘舵€佹満銆佹潈闄愩€佸苟鍙?CAS銆丄I 闄嶇骇閮藉湪杩欓噷璺戯紝涓嶈繃灏卞埆寰€涓嬭蛋
      - name: 鍗曞厓娴嬭瘯
        run: go test -count=1 ./...

      - name: 缂栬瘧
        run: go build ./...

  web:
    name: React 绠＄悊绔?
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 瀹夎渚濊禆
        run: npm ci

      # 任务书 3.2 第 4 条（后端不可用不能白屏）就在这三条用例里
      - name: 单元测试
        run: npm test

      - name: 绫诲瀷妫€鏌ュ苟鏋勫缓
        run: npm run build
