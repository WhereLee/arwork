name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go 后端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 版本从 go.mod 读，避免和本地工具链对不上
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 静态检查
        run: go vet ./...

      # 状态机、权限、并发 CAS、AI 降级都在这里跑，不过就别往下走
      - name: 单元测试
        run: go test -count=1 ./...

      - name: 编译
        run: go build ./...

  web:
    name: React 管理端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查并构建
        run: npm run build
